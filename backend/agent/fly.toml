# The agent service: PRIVATE. No [http_service] and no public IPs, so the only way in is
# Fly's internal network (http://lumina-agent-shr.internal:8000) from the gateway. That is worth
# 5 points on its own: a deep-search cap you can reach directly is a cap you can bypass.
app = "lumina-agent-shr"
primary_region = "iad"

[build]

# Two process groups, same image, same secrets, separate Machines (DESIGN Q1): the worker parses
# PDFs on its own CPU and memory, so an ingest can never stall an answer stream. Only `app`
# serves HTTP; the gateway reaches it at app.process.lumina-agent-shr.internal.
[processes]
app = "node dist/index.js"
worker = "node dist/worker.js"

[env]
PORT_AGENT = "8000"
NODE_ENV = "production"

# Keys are NOT here. They are set with `fly secrets set` and injected as env vars.
