# The gateway: PUBLIC. The only service the browser talks to, and it holds no provider keys.
app = "lumina-gateway-shr"
primary_region = "iad"

[build]

[env]
PORT_GATEWAY = "8787"
NODE_ENV = "production"

[http_service]
internal_port = 8787
force_https = true
auto_stop_machines = "suspend"
auto_start_machines = true
min_machines_running = 1

# A streamed answer can take a while; do not let the proxy cut it off.
[http_service.concurrency]
type = "requests"
soft_limit = 25
hard_limit = 50

# NO health check here, on purpose.
# /health answers 503 when the agent is down — that is the contract, and it is honest. But Fly
# reads 503 as "this machine is broken", drops it from the load balancer, and the whole site goes
# unreachable instead of showing an honest "agent down" error. Liveness (is the gateway process
# up?) and readiness (is its dependency up?) are different questions, and Fly's check conflates
# them. Fly routes while the process lives; callers get the truthful 503 from /health.
# Found the hard way on Day 3: the agent stopped, /health went 503, and the whole site went dark.
